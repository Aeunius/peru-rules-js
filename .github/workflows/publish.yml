name: publish

# Publica en npm al crear un release en GitHub. El tag tiene que coincidir con
# la versión de package.json (v1.0.0 ↔ 1.0.0).
#
# Se autentica con publicación confiable (OIDC), configurada en npmjs.com para
# este repo, este workflow y el environment npm: no hay tokens. El paquete sale
# con provenance. La primera versión se publicó a mano con `make publicar`,
# porque la publicación confiable solo se configura en paquetes que ya existen.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: El tag coincide con package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::El tag ${GITHUB_REF_NAME} no coincide con la versión ${version} de package.json"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check

      - name: Versión aún sin publicar
        id: pendiente
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "::notice::${GITHUB_REF_NAME} ya está en npm; no se vuelve a publicar"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pendiente.outputs.publicar == 'true'
        run: npm publish --provenance --access public
