name: publish

# Publica en npm al subir una etiqueta vX.Y.Z, con provenance. Usa la
# publicación de confianza de npm (OIDC): no hace falta un token, pero el
# paquete debe tener configurado este repositorio y este workflow en npmjs.com.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: La etiqueta coincide con package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm publish
